services:
  postgres:
    image: postgres:16-alpine
    container_name: investcops-postgres
    environment:
      POSTGRES_USER: investcops
      POSTGRES_PASSWORD: investcops
      POSTGRES_DB: investcops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investcops"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: investcops-neo4j
    environment:
      NEO4J_AUTH: neo4j/investcops
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  backend:
    build: ./backend
    container_name: investcops-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://investcops:investcops@postgres:5432/investcops
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: investcops
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: investcops-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
